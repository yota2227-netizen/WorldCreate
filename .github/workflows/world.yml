name: 世界の時計

on:
  # 毎時の実行は外部サービス（cron-job.org）が workflow_dispatch で合図を送る。
  # GitHubの schedule は時刻が不安定だったため使わない。
  push:
    branches: [main]
    paths: ["oracle.md"]   # 神託が書かれたら即座に反映
  workflow_dispatch:
    inputs:
      mode:
        description: "実行する処理"
        type: choice
        default: auto
        options: [auto, oracle, create, report, epoch]

permissions:
  contents: write

concurrency:
  group: world-clock
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 実行モードを決める
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "mode=oracle" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT";
          else echo "mode=auto" >> "$GITHUB_OUTPUT"; fi

      - name: 世界を動かす
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORLD_MONTHLY_BUDGET: ${{ vars.WORLD_MONTHLY_BUDGET || '90' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY が未登録のため、世界はまだ眠っています"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          python engine/tick.py "${{ steps.mode.outputs.mode }}"

      - name: 世界の変化を記録する
        if: steps.run.outputs.ran == 'true'
        run: |
          git config user.name "world-clock"
          git config user.email "world-clock@users.noreply.github.com"
          git add -A world oracle.md
          if git diff --cached --quiet; then echo "変化なし"; exit 0; fi
          DATE=$(python -c "import json;print(json.load(open('world/index.json'))['date'])")
          git commit -m "🌍 ${DATE}（${{ steps.mode.outputs.mode }}）"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
