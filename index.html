<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界観測所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="viewer/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
<header class="masthead">
  <div class="sigil" aria-hidden="true"></div>
  <div class="mast-text">
    <p class="eyebrow">世界観測所</p>
    <h1 id="world-name">名もなき世界</h1>
    <p id="world-date" class="date">—</p>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-view="home" class="on">いま</button>
  <button data-view="map">地図</button>
  <button data-view="reports">月報</button>
  <button data-view="genesis">創世記</button>
  <button data-view="codex">図鑑</button>
  <button data-view="timeline">年表</button>
  <button data-view="canon">聖典</button>
  <button data-view="search" aria-label="検索">検索</button>
</nav>

<main>
  <section id="view-home" class="view on">
    <div class="phases" id="phases"></div>
    <article class="card scroll" id="latest-creation"></article>
    <div class="grid2">
      <article class="card" id="latest-report"></article>
      <article class="card" id="recent-events"></article>
    </div>
    <p class="meta" id="meta"></p>
  </section>

  <section id="view-map" class="view">
    <div class="map-tools">
      <label><input type="radio" name="layer" value="terrain" checked> 地形</label>
      <label><input type="radio" name="layer" value="magic"> 魔力</label>
      <label><input type="checkbox" id="show-labels" checked> 地名</label>
    </div>
    <div class="map-wrap"><canvas id="map" width="1200" height="840"></canvas></div>
    <article class="card" id="region-info"><p class="muted">地図をタップすると、その土地の記録が表示されます。</p></article>
  </section>

  <section id="view-reports" class="view">
    <select id="report-select" class="picker"></select>
    <article class="card prose paper" id="report-body"></article>
  </section>

  <section id="view-genesis" class="view">
    <div id="genesis-list"></div>
  </section>

  <section id="view-codex" class="view">
    <div class="subtabs" id="codex-tabs">
      <button data-c="species" class="on">生き物</button>
      <button data-c="peoples">種族</button>
      <button data-c="settlements">集落</button>
      <button data-c="magic">法則と魔法</button>
      <button data-c="regions">地域</button>
    </div>
    <div class="codex" id="codex"></div>
  </section>

  <section id="view-timeline" class="view">
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section id="view-canon" class="view">
    <div class="subtabs" id="canon-tabs"></div>
    <article class="card prose" id="canon-body"></article>
  </section>
  <section id="view-search" class="view">
    <div class="search-box">
      <input id="search-input" type="search" placeholder="用語・地名・出来事などを検索（例：憶石、ほどき月）" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="search-filters" id="search-filters"></div>
    <p class="muted search-count" id="search-count"></p>
    <div id="search-results"></div>
  </section>
</main>

<footer class="foot">
  神託を届けるには、リポジトリの <code>oracle.md</code> に一言書いて保存してください。
</footer>
<script src="viewer/map.js"></script>
<script src="viewer/app.js"></script>
</body>
</html>
